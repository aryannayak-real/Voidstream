name: VoidStream Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle
        run: chmod +x gradlew && mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Decode release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || exit 1
          printf '%s' "$KEYSTORE" | base64 -d > release.keystore
      - name: Test and build stable APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew spotlessCheck :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --build-cache --stacktrace
      - name: Verify signed release
        if: startsWith(github.ref, 'refs/tags/v')
        run: apksigner verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: voidstream-universal-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VoidStream ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
